# Paste inside the existing HTTPS server {} for your chosen hostname.
# EXAMPLE ONLY: replace 192.168.1.50 with the ionpath VM private address.
# Public hostname example: ionpath.example.com; substitute your own domain.
location / {
    proxy_pass http://192.168.1.50:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_buffering off;
    client_max_body_size 20m;
}
